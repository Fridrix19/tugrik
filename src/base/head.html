<title>{{TITLE}}</title>
<meta name="theme-color" content="#F3F5EE">
<link rel="icon" type="image/svg+xml" href="{{LOGO}}">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>(function(){var t="light";try{var s=localStorage.getItem("mc-theme");if(s==="light"||s==="dark")t=s;}catch(e){}var h=document.documentElement;h.setAttribute("data-mc-theme",t);h.classList.toggle("mc-dark",t!=="light");})();</script>
